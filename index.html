
<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155eef">
<title>HWA Recap</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#f3f6fc;color:#172033;font-family:system-ui,sans-serif}
main{max-width:760px;margin:auto}
.hero{background:linear-gradient(135deg,#104fc8,#4388ff);color:white;padding:24px 20px;border-radius:22px}
h1{margin:8px 0;font-size:27px}
.card{background:white;margin-top:15px;padding:18px;border-radius:18px;border:1px solid #e3eaf5}
h2{font-size:18px;margin:0 0 12px}
label{display:block;font-weight:700;margin:12px 0 7px}
input,textarea{width:100%;font:inherit;border:1px solid #d6deeb;border-radius:12px;padding:12px}
textarea{min-height:220px;line-height:1.8}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px;cursor:pointer}
button:disabled{opacity:.5}
.primary{width:100%;background:#155eef;color:white;margin-top:13px}
.soft{background:#eaf1ff;color:#155eef;flex:1}
.row{display:flex;gap:9px;margin-top:10px}
.note,.status{font-size:13px;line-height:1.8;color:#64748b}
.status{background:#f1f6ff;color:#31558f;padding:12px;border-radius:12px;margin-top:12px;white-space:pre-wrap}
.foot{font-size:12px;color:#7b8495;line-height:1.8}
</style>
</head>
<body>
<main>
<header class="hero">
<span>HWA • RECAP STUDIO</span>
<h1>HWA Recap</h1>
<p>ဗီဒီယိုမှ မြန်မာ Recap စာသား ဖန်တီးရန်</p>
</header>

<section class="card">
<h2>၁။ ဗီဒီယိုတင်ရန်</h2>
<label for="video">ဖုန်းထဲမှ ဗီဒီယိုရွေးပါ</label>
<input id="video" type="file" accept="video/*">
<p class="note" id="info">ဗီဒီယိုဖိုင် မရွေးရသေးပါ။</p>
<button id="start" class="primary">Recap စတင်ရန်</button>
<div id="status" class="status">အသင့်ဖြစ်ပါပြီ။</div>
</section>

<section class="card">
<h2>၂။ မြန်မာ Recap စာသား</h2>
<textarea id="recap" placeholder="Recap စာသား ဒီနေရာမှာ ပေါ်လာပါမယ်။"></textarea>
<div class="row">
<button id="copy" class="soft">Copy</button>
<button id="save" class="soft">စာသားသိမ်းရန်</button>
</div>
</section>

<p class="foot">
မှတ်ချက် — ကိုယ်ပိုင် သို့မဟုတ် အသုံးပြုခွင့်ရှိသော Video ကိုသာ အသုံးပြုပါ။
</p>
</main>

<script>
const $ = id => document.getElementById(id);
let selectedFile = null;

const CHUNK_SIZE = 2 * 1024 * 1024;

$('video').addEventListener('change', () => {
  selectedFile = $('video').files[0] || null;
  $('info').textContent = selectedFile
    ? selectedFile.name + ' • ' +
      (selectedFile.size / 1048576).toFixed(1) + ' MB'
    : 'ဗီဒီယိုဖိုင် မရွေးရသေးပါ။';
});

async function readJSON(response) {
  const text = await response.text();

  try {
    return JSON.parse(text);
  } catch {
    throw new Error(
      'Server HTTP ' + response.status +
      ': ' + text.slice(0,250)
    );
  }
}

$('start').addEventListener('click', async () => {
  if (!selectedFile) {
    $('status').textContent = 'ဗီဒီယိုဖိုင်ကို အရင်ရွေးပါ။';
    return;
  }

  $('start').disabled = true;

  try {
    // 1. Upload session စတင်ခြင်း
    $('status').textContent = 'Upload ပြင်ဆင်နေပါတယ်။';

    const sessionResponse = await fetch(
      '/.netlify/functions/process?action=upload',
      {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          fileName: selectedFile.name,
          mimeType: selectedFile.type || 'video/mp4',
          fileSize: selectedFile.size
        })
      }
    );

    const sessionData = await readJSON(sessionResponse);

    if (!sessionResponse.ok || !sessionData.uploadUrl) {
      throw new Error(
        sessionData.message ||
        sessionData.error ||
        'Upload session မရပါ။'
      );
    }

    const uploadUrl = sessionData.uploadUrl;
    const totalSize = selectedFile.size;
    const totalChunks = Math.ceil(totalSize / CHUNK_SIZE);

    let offset = 0;
    let uploadedFile = null;

    // 2. 2MB စီ ခွဲတင်ခြင်း
    for (let i = 0; i < totalChunks; i++) {
      const end = Math.min(offset + CHUNK_SIZE, totalSize);
      const chunk = selectedFile.slice(offset, end);
      const isLast = end === totalSize;

      const percent = Math.floor(
        (end / totalSize) * 100
      );

      $('status').textContent =
        'Google ဆီ Video Upload လုပ်နေပါတယ်။\n' +
        percent + '% ပြီးပါပြီ (' +
        (end / 1048576).toFixed(1) + ' / ' +
        (totalSize / 1048576).toFixed(1) + ' MB)';

      const uploadResponse = await fetch(uploadUrl, {
        method: 'POST',
        headers: {
          'X-Goog-Upload-Offset': String(offset),
          'X-Goog-Upload-Command': isLast
            ? 'upload, finalize'
            : 'upload'
        },
        body: chunk
      });

      const responseText = await uploadResponse.text();

      if (!uploadResponse.ok) {
        throw new Error(
          'Upload အပိုင်း ' + (i + 1) +
          ' မအောင်မြင်ပါ။ HTTP ' +
          uploadResponse.status + ': ' +
          responseText.slice(0,250)
        );
      }

      if (isLast) {
        try {
          uploadedFile = JSON.parse(responseText);
        } catch {
          throw new Error(
            'နောက်ဆုံး Upload တုံ့ပြန်ချက် မမှန်ပါ။'
          );
        }
      }

      offset = end;
    }

    // 3. Google File URI ရယူခြင်း
    const file = uploadedFile?.file || uploadedFile;

    if (!file?.uri) {
      throw new Error('Google Video URI မရရှိပါ။');
    }

    // 4. Recap တောင်းခြင်း
    $('status').textContent =
      'Upload ပြီးပါပြီ။ AI က Recap ရေးနေပါတယ်။';

    const analyzeResponse = await fetch(
      '/.netlify/functions/process',
      {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          action: 'analyze',
          fileUri: file.uri,
          mimeType: selectedFile.type || 'video/mp4'
        })
      }
    );

    const result = await readJSON(analyzeResponse);

    if (!analyzeResponse.ok || !result.success) {
      throw new Error(
        result.message ||
        result.error ||
        'Recap မထွက်လာပါ။'
      );
    }

    if (!result.recap) {
      throw new Error('Recap စာသား မရရှိပါ။');
    }

    $('recap').value = result.recap;
    $('status').textContent = 'Recap စာသား ရပါပြီ။';

  } catch (error) {
    $('status').textContent =
      'အမှား: ' + (error.message || 'Upload မအောင်မြင်ပါ။');
  } finally {
    $('start').disabled = false;
  }
});

$('copy').addEventListener('click', async () => {
  const text = $('recap').value;

  if (!text.trim()) {
    $('status').textContent = 'ကူးရန် စာသားမရှိသေးပါ။';
    return;
  }

  try {
    await navigator.clipboard.writeText(text);
    $('status').textContent = 'စာသားကူးပြီးပါပြီ။';
  } catch {
    $('recap').select();
    $('status').textContent = 'စာသားကို ဖိထားပြီး Copy လုပ်ပါ။';
  }
});

$('save').addEventListener('click', () => {
  const text = $('recap').value;

  if (!text.trim()) {
    $('status').textContent = 'သိမ်းရန် စာသားမရှိသေးပါ။';
    return;
  }

  const url = URL.createObjectURL(
    new Blob([text], {type:'text/plain;charset=utf-8'})
  );

  const link = document.createElement('a');
  link.href = url;
  link.download = 'hwa-recap.txt';
  link.click();

  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
</script>
</body>
</html>
